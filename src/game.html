<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行动代号 - 创想世界</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:linear-gradient(135deg,#0f0c29,#302b63,#24243e);--primary:#00d4ff;--red:#ff4757;--blue:#3742fa;--text:#fff;--dim:rgba(255,255,255,0.55);--glass:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.08)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter','Noto Sans SC',sans-serif;background:var(--bg);min-height:100vh;padding:20px;color:var(--text)}
        .container{max-width:700px;margin:0 auto}
        h1{text-align:center;font-size:1.8rem;font-weight:700;margin-bottom:5px;letter-spacing:2px}
        .back{position:absolute;top:20px;left:20px;color:var(--dim);text-decoration:none;font-size:14px}
        .back:hover{color:var(--primary)}
        .mode-select{display:flex;justify-content:center;gap:10px;margin-bottom:15px}
        .mode-btn{padding:10px 24px;border:2px solid var(--border);border-radius:24px;background:var(--glass);color:var(--dim);cursor:pointer;transition:0.3s;font-size:14px}
        .mode-btn.active{border-color:var(--primary);color:var(--primary);background:rgba(0,212,255,0.1)}
        .mode-desc{text-align:center;color:var(--dim);font-size:14px;margin-bottom:15px;padding:12px;background:var(--glass);border-radius:10px}
        .status-bar{display:flex;justify-content:center;gap:15px;margin-bottom:15px}
        .status-item{background:var(--glass);padding:8px 20px;border-radius:20px;display:flex;gap:8px;font-size:14px}
        .status-item .value{font-weight:600}
        .status-item.red .value{color:var(--red)}
        .status-item.blue .value{color:var(--blue)}
        .clue-area{background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(168,85,247,0.1));border:1px solid var(--primary);padding:15px;border-radius:15px;margin-bottom:15px;text-align:center}
        .clue-label{color:var(--dim);font-size:12px;margin-bottom:8px}
        .clue-display{font-size:1.8rem;font-weight:700;margin:5px 0}
        .clue-display .word{color:var(--primary)}
        .clue-display .num{color:var(--red)}
        .clue-turn{color:var(--dim);font-size:14px}
        .board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}
        .card{aspect-ratio:3/2;background:var(--glass);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s;color:#fff;font-weight:600;font-size:clamp(8px, 2vw, 14px);text-align:center;padding:4px;word-break:break-word;line-height:1.2}
        .card:hover:not(.revealed){transform:translateY(-4px);border-color:var(--primary);box-shadow:0 10px 30px rgba(0,0,0,0.3)}
        .card.revealed{opacity:0.4}
        .card.revealed.red{background:var(--red)!important;border-color:var(--red)!important}
        .card.revealed.blue{background:var(--blue)!important;border-color:var(--blue)!important}
        .card.revealed.neutral{background:#666!important}
        .card.revealed.black{background:#000!important;border:2px solid var(--red)!important}
        .score-board{display:flex;justify-content:center;gap:15px;margin-bottom:15px}
        .score-card{background:var(--glass);padding:12px 30px;border-radius:15px;text-align:center}
        .score-card .team{color:var(--dim);font-size:12px}
        .score-card .score{font-size:1.6rem;font-weight:700}
        .score-card.red .score{color:var(--red)}
        .score-card.blue .score{color:var(--blue)}
        .controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
        .btn{padding:10px 18px;border:none;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:0.3s;display:flex;align-items:center;gap:6px;user-select:none}
        .btn-primary{background:linear-gradient(135deg,#00d4ff,#a855f7);color:#fff}
        .btn-secondary{background:var(--glass);border:1px solid var(--border);color:var(--text)}
        .btn-success{background:linear-gradient(135deg,#00d9a5,#00b894);color:#fff}
        .giver-input{background:var(--glass);padding:15px;border-radius:15px;margin-bottom:15px;display:none}
        .giver-input.active{display:block}
        .giver-input h3{margin-bottom:12px;font-size:15px}
        .input-row{display:flex;gap:8px;margin-bottom:12px}
        .input-row input{flex:1;padding:10px;background:rgba(255,255,255,0.08);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:14px}
        .modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
        .modal.active{display:flex}
        .modal-inner{background:#0f0f0f;border:1px solid var(--border);border-radius:20px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;position:relative}
        .modal h2{text-align:center;margin-bottom:20px;font-size:1.2rem}
        .modal-close{position:absolute;top:12px;right:12px;background:var(--glass);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
        .form-group{margin-bottom:15px}
        .form-group label{display:block;margin-bottom:6px;color:var(--dim);font-size:13px}
        .form-group select,.form-group input,.form-group textarea{width:100%;padding:10px;background:var(--glass);border:1px solid var(--border);border-radius:8px;color:#fff;font-size:14px}
        .form-group select option{background:#0f0f0f}
        .form-group textarea{min-height:60px}
        .form-group .hint{font-size:12px;color:var(--dim);margin-top:4px}
        .modal .controls{margin-top:15px}
        .master-board{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
        .master-card{aspect-ratio:3/2;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(8px, 1.5vw, 11px);font-weight:600;text-align:center;padding:2px;word-break:break-word;line-height:1.1}
        .master-card.red{background:var(--red)}
        .master-card.blue{background:var(--blue)}
        .master-card.neutral{background:#666}
        .master-card.black{background:#000;border:1px solid var(--red)}
        .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(168,85,247,0.2));border:1px solid var(--primary);padding:10px 20px;border-radius:10px;transition:0.3s;z-index:200;font-size:14px}
        .toast.show{transform:translateX(-50%) translateY(0)}
        @media(max-width:500px){.board{gap:5px}}
    </style>
</head>
<body>
<a href="games.html" class="back">返回</a>
<div class="container">
    <h1>行动代号</h1>
    <div class="mode-select">
        <button class="mode-btn active" id="guesserBtn" onclick="setMode('guesser')">猜词者</button>
        <button class="mode-btn" id="giverBtn" onclick="setMode('giver')">出题者</button>
    </div>
    <div class="mode-desc" id="modeDesc">你是猜词者。你看不到卡牌颜色。</div>
    <div class="status-bar">
        <div class="status-item">回合: <span class="value" id="currentTeam">红方</span></div>
        <div class="status-item">剩余: <span class="value" id="remaining">25</span></div>
    </div>
    <div class="clue-area" id="clueArea">
        <div class="clue-label">当前线索</div>
        <div class="clue-display"><span class="word" id="clueWord">---</span> <span class="num" id="clueNum"></span></div>
        <div class="clue-turn" id="clueTurn">等待出题者...</div>
    </div>
    <div class="giver-input" id="giverInput">
        <h3>出题者：输入线索</h3>
        <div class="input-row">
            <input type="text" id="clueInput" placeholder="词语 (例如: 动物)">
            <input type="number" id="clueNumInput" placeholder="数量" min="1" max="8" style="width:60px">
        </div>
        <button class="btn btn-primary" onclick="submitClue()">提交</button>
    </div>
    <div class="board" id="board"></div>
    <div class="score-board">
        <div class="score-card red"><div class="team">红方</div><div class="score" id="redScore">9</div></div>
        <div class="score-card blue"><div class="team">蓝方</div><div class="score" id="blueScore">8</div></div>
    </div>
    <div class="controls">
        <button class="btn btn-primary" onclick="newGame()">新游戏</button>
        <button class="btn btn-success" onclick="openAIWordsModal()">AI词库</button>
        <button class="btn btn-secondary" onclick="toggleMaster()">密码本</button>
        <button class="btn btn-secondary" onclick="openSettings()">设置</button>
    </div>
</div>
<div class="modal" id="masterModal">
    <div class="modal-inner">
        <button class="modal-close" onclick="toggleMaster()">×</button>
        <h2>密码本</h2>
        <div class="master-board" id="masterBoard"></div>
    </div>
</div>
<div class="modal" id="aiModal">
    <div class="modal-inner">
        <button class="modal-close" onclick="closeAIModal()">×</button>
        <h2>AI词库</h2>
        <div class="form-group">
            <label>主题</label>
            <select id="aiTopic" onchange="handleTopicChange()">
                <option value="">-- 选择 --</option>
                <option value="travel">旅行</option>
                <option value="food">美食</option>
                <option value="tech">科技</option>
                <option value="sports">运动</option>
                <option value="art">艺术</option>
                <option value="nature">自然</option>
                <option value="education">教育</option>
                <option value="business">商业</option>
                <option value="health">健康</option>
                <option value="fashion">时尚</option>
                <option value="custom">自定义...</option>
            </select>
        </div>
        <div class="form-group" id="customTopicGroup" style="display:none">
            <label>自定义主题</label>
            <input type="text" id="customTopic" placeholder="输入主题">
        </div>
        <div class="form-group">
            <label>DeepSeek API Key</label>
            <input type="password" id="apiKey" placeholder="sk-xxxx">
        </div>
        <div class="form-group">
            <label>混合比例</label>
            <select id="mixRatio">
                <option value="100">100% AI</option>
                <option value="80">80% AI + 20% Default</option>
                <option value="60">60% AI + 40% Default</option>
                <option value="50" selected>50% AI + 50% Default</option>
                <option value="40">40% AI + 60% Default</option>
                <option value="20">20% AI + 80% Default</option>
            </select>
        </div>
        <div class="controls">
            <button class="btn btn-success" onclick="generateWords()" id="genBtn">生成</button>
        </div>
    </div>
</div>
<div class="modal" id="settingsModal">
    <div class="modal-inner">
        <button class="modal-close" onclick="closeSettings()">×</button>
        <h2>设置</h2>
        <div class="form-group">
            <label>主题</label>
            <select id="themeSel" onchange="changeTheme(this.value)">
                <option value="default">深色</option>
                <option value="sunset">日落</option>
                <option value="forest">森林</option>
                <option value="pink">粉色</option>
                <option value="ocean">海洋</option>
            </select>
        </div>
        <div class="form-group">
            <label>当前词库</label>
            <textarea id="wordPreview" readonly></textarea>
            <p class="hint">数量: <span id="wordCount">0</span></p>
        </div>
        <div class="controls">
            <button class="btn btn-primary" onclick="saveSettings()">保存</button>
        </div>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
const presets={
'travel':['背包旅行','护照','航班','民宿','景区','导游','行程','自驾游','观光','度假','签证','门票','酒店','海滩','雪山','古镇','露营','探险','摄影','纪念品','旅行日记','向导','自由行'],
'food':['烹饪','菜谱','食材','调料','烘焙','火锅','烧烤','甜点','小吃','菜系','刀工','火候','摆盘','米其林','时令','美味','味道','厨师','餐厅','招牌菜','家常菜','美食探店','私房菜','口味'],
'tech':['人工智能','算法','编程','数据','云计算','区块链','物联网','芯片','机器人','虚拟现实','无人机','5G','网络安全','大数据','半导体','创新','孵化器','智能家居','生物科技','可穿戴设备','开源','数字化','自动化','人机交互','量子计算'],
'sports':['健身','瑜伽','马拉松','游泳','篮球','足球','羽毛球','网球','滑雪','骑行','热身','拉伸','教练','比赛','冠军','奖牌','运动员','裁判','训练','奥运会','俱乐部','健美操'],
'art':['绘画','雕塑','音乐','舞蹈','戏剧','电影','摄影','文学','诗歌','书法','画廊','博物馆','展览','创作','灵感','色彩','旋律','节奏','导演','演员','艺术家','作品','鉴赏','美学','文艺复兴'],
'nature':['森林','海洋','山脉','河流','湖泊','草原','沙漠','冰川','星空','日出','日落','气候','生态系统','物种','保护','环境','野生动物','植物','季风','雨林','湿地','珊瑚礁','自然保护区','光合作用','生物多样性'],
'education':['学校','老师','学生','课程','教材','考试','教室','学习','知识','学位','图书馆','研究','培训','启蒙','素质','在线教育','学前教育','高等教育','职业教育','学术','论文','导师','奖学金','校园','自学'],
'business':['市场','营销','品牌','管理','投资','融资','创业','公司','产品','服务','客户','销售','利润','竞争','战略','电商','零售','供应链','广告','企业家','董事会','商业模式','财报','并购','初创'],
'health':['健康','医疗','营养','运动','睡眠','心理','体检','疫苗','疾病','预防','康复','中医','西医','免疫力','心理健康','瑜伽','冥想','饮食','作息','亚健康','慢性病','长寿','健身','保健品','体检'],
'fashion':['服装','设计','潮流','品牌','搭配','模特','走秀','奢侈品','珠宝','化妆品','发型','护肤','街拍','复古','极简','定制','面料','色彩','趋势','设计师','买手','时尚杂志','穿搭','配饰','潘通色']
};
const defaults=['苹果','香蕉','电脑','手机','汽车','飞机','太阳','月亮','星星','海洋','山脉','河流','森林','沙漠','城市','乡村','学校','医院','公园','商场','音乐','电影','书籍','绘画','舞蹈','足球','篮球','游泳','跑步','骑行','咖啡','茶','面包','蛋糕','巧克力','冰激凌','披萨','寿司','火锅','烧烤','春天','夏天','秋天','冬天','雨','雪','风','雷','彩虹','云','猫','狗','兔子','老虎','狮子','大象','长颈鹿','熊猫','企鹅','海豚'];
const themes={default:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)',sunset:'linear-gradient(135deg,#2d1f3d,#614385,#516395)',forest:'linear-gradient(135deg,#134e5e,#71b280)',pink:'linear-gradient(135deg,#3a1c71,#d76d77,#ffaf7b)',ocean:'linear-gradient(135deg,#0f2027,#203a43,#2c5364)'};
let aiWords=[],customWords=[],useCustom=false,currentTheme='default';
let state={cards:[],red:9,blue:8,team:'red',revealed:0,clue:{word:'',num:0},guesses:0,over:false};
let mode='guesser';

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}
function load(){const s=localStorage.getItem('codenames_v5');if(s){const x=JSON.parse(s);if(x.theme)currentTheme=x.theme;if(x.ai)aiWords=x.ai.split('\n').filter(w=>w);if(x.custom){customWords=x.custom.split('\n').filter(w=>w);document.getElementById('wordPreview').value=x.custom;document.getElementById('wordCount').textContent=customWords.length;if(customWords.length>=25)useCustom=true;}document.getElementById('themeSel').value=currentTheme;document.body.style.background=themes[currentTheme];}}
function save(){localStorage.setItem('codenames_v5',JSON.stringify({theme:currentTheme,ai:aiWords.join('\n'),custom:customWords.join('\n')}));toast('已保存');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newGame(){let pool=[];const mix=parseInt(document.getElementById('mixRatio')?.value||50);if(aiWords.length>=25&&mix>0){const a=Math.floor(25*mix/100);const d=25-a;pool=[...shuffle([...aiWords]).slice(0,a),...shuffle([...defaults]).slice(0,d)];pool=shuffle(pool);}else if(useCustom&&customWords.length>=25){pool=shuffle([...customWords]);}else{pool=shuffle([...defaults]);}const w=pool.slice(0,25);const c=shuffle([...Array(9).fill('red'),...Array(8).fill('blue'),...Array(7).fill('neutral'),...Array(1).fill('black')]);state={cards:w.map((word,i)=>({word,color:c[i],revealed:false})),red:9,blue:8,team:'red',revealed:0,clue:{word:'---',num:0},guesses:0,over:false};render();renderMaster();update();toast('新游戏 - 红方先行');}
function render(){document.getElementById('board').innerHTML=state.cards.map((c,i)=>'<div class="card '+(c.revealed?'revealed '+c.color:'')+  '" onclick="clickCard('+i+')">'+c.word+'</div>').join('');}
function renderMaster(){document.getElementById('masterBoard').innerHTML=state.cards.map(c=>'<div class="master-card '+c.color+'">'+c.word+'</div>').join('');}
function update(){document.getElementById('currentTeam').textContent=state.team==='red'?'红方':'蓝方';document.getElementById('currentTeam').style.color=state.team==='red'?'var(--red)':'var(--blue)';document.getElementById('remaining').textContent=25-state.revealed;document.getElementById('redScore').textContent=state.red;document.getElementById('blueScore').textContent=state.blue;document.getElementById('clueWord').textContent=state.clue.word;document.getElementById('clueNum').textContent=state.clue.num>0?state.clue.num:'';document.getElementById('clueTurn').textContent=state.guesses>0?'剩余次数: '+state.guesses:'等待出题者...';}
function clickCard(i){if(state.over)return;const c=state.cards[i];if(c.revealed)return;c.revealed=true;state.revealed++;if(state.guesses>0)state.guesses--;if(c.color==='black'){state.over=true;state.cards.forEach(x=>x.revealed=true);render();toast('卧底! '+(state.team==='red'?'蓝方':'红方')+'获胜!');return;}if(c.color==='red'){state.red--;toast(state.team==='red'?(state.guesses>0?'正确':'回合结束'):(state.guesses>0?'错误':'回合结束'));if(state.guesses===0)switchTeam();}else if(c.color==='blue'){state.blue--;toast(state.team==='blue'?(state.guesses>0?'正确':'回合结束'):(state.guesses>0?'错误':'回合结束'));if(state.guesses===0)switchTeam();}else{toast('中立');if(state.guesses===0)switchTeam();}if(state.red===0){state.over=true;state.cards.forEach(x=>x.revealed=true);render();toast('红方获胜!');return;}if(state.blue===0){state.over=true;state.cards.forEach(x=>x.revealed=true);render();toast('蓝方获胜!');return;}if(state.guesses===0&&!state.over)switchTeam();render();update();}
function switchTeam(){state.team=state.team==='red'?'blue':'red';state.clue={word:'---',num:0};state.guesses=0;toast('切换到 '+(state.team==='red'?'红方':'蓝方'));update();}
function setMode(m){mode=m;document.getElementById('guesserBtn').classList.toggle('active',m==='guesser');document.getElementById('giverBtn').classList.toggle('active',m==='giver');document.getElementById('modeDesc').textContent=m==='guesser'?'你是猜词者':'你是出题者 - 查看密码本';document.getElementById('clueArea').style.display=m==='guesser'?'block':'none';document.getElementById('giverInput').classList.toggle('active',m==='giver');}
function submitClue(){const w=document.getElementById('clueInput').value.trim();const n=parseInt(document.getElementById('clueNumInput').value);if(!w||!n||n<1||n>8){toast('请输入词语和1-8的数字');return;}state.clue={word:w,num:n};state.guesses=n+1;setMode('guesser');document.getElementById('clueInput').value='';document.getElementById('clueNumInput').value='';toast('线索: '+w+' '+n);update();}
function toggleMaster(){document.getElementById('masterModal').classList.toggle('active');}
function openAIWordsModal(){document.getElementById('aiModal').classList.add('active');}
function closeAIModal(){document.getElementById('aiModal').classList.remove('active');}
function openSettings(){document.getElementById('settingsModal').classList.add('active');}
function closeSettings(){document.getElementById('settingsModal').classList.remove('active');}
function handleTopicChange(){const v=document.getElementById('aiTopic').value;document.getElementById('customTopicGroup').style.display=v==='custom'?'block':'none';if(presets[v]){aiWords=presets[v];toast('已选择: '+v);}}
function changeTheme(t){currentTheme=t;document.body.style.background=themes[t];}
function saveSettings(){save();closeSettings();}
async function generateWords(){const topic=document.getElementById('aiTopic').value;const custom=document.getElementById('customTopic').value;const apiKey=document.getElementById('apiKey').value;if(!apiKey){toast('请输入API Key');return;}let words=[];if(topic==='custom'){if(!custom){toast('请输入主题');return;}document.getElementById('genBtn').innerHTML='生成中...';document.getElementById('genBtn').disabled=true;try{const res=await fetch('https://api.deepseek.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:'deepseek-chat',messages:[{role:'user',content:'Generate 25 Chinese words related to "'+custom+'" for a board game. One word per line.'}],max_tokens:500})});const data=await res.json();if(data.choices){words=data.choices[0].message.content.split('\n').map(w=>w.trim().replace(/^\d+\./,'')).filter(w=>w);}}catch(e){toast('错误: '+e.message);}}else if(presets[topic]){words=presets[topic];}else{toast('请选择主题');return;}if(words.length>=25){aiWords=words.slice(0,25);customWords=aiWords;useCustom=true;document.getElementById('wordPreview').value=aiWords.join('\n');document.getElementById('wordCount').textContent=aiWords.length;save();closeAIModal();toast('生成成功!');}else{toast('需要25个以上词语');}document.getElementById('genBtn').innerHTML='生成';document.getElementById('genBtn').disabled=false;}
load();newGame();
</script>
</body>
