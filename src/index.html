<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创想世界</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --surface-elevated: #141414;
            --border: #262626;
            --text: #ffffff;
            --text-secondary: #737373;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }
        
        /* Hero with background */
        .hero {
            position: relative;
            height: 70vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .hero-bg {
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.8)),
                url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1920&q=80') center/cover no-repeat;
        }
        
        .hero-content {
            position: relative;
            text-align: center;
            max-width: 800px;
            padding: 24px;
        }
        
        .logo {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            margin-bottom: 32px;
        }
        
        .hero h1 {
            font-size: clamp(3rem, 8vw, 5.5rem);
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: -0.03em;
            margin-bottom: 24px;
        }
        
        .hero p {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.7);
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* Sections */
        .section { padding: 80px 0; border-top: 1px solid var(--border); }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 48px;
        }
        
        .section-title {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            text-transform: uppercase;
        }
        
        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }
        
        .grid-item {
            background: var(--surface);
            position: relative;
            aspect-ratio: 4/3;
            cursor: pointer;
            overflow: hidden;
        }
        
        .grid-item:hover .grid-overlay { opacity: 1; }
        
        .grid-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s ease;
        }
        
        .grid-item:hover .grid-bg { transform: scale(1.05); }
        
        .grid-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 32px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .grid-item h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .grid-item p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.7);
        }
        
        .grid-count {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #000;
            background: #fff;
            padding: 4px 12px;
            border-radius: 999px;
        }
        
        /* Works */
        .works {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }
        
        .work-item {
            background: var(--surface);
            position: relative;
            aspect-ratio: 16/9;
            cursor: pointer;
            overflow: hidden;
        }
        
        .work-item:hover .work-bg { transform: scale(1.03); }
        
        .work-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s ease;
        }
        
        .work-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0.2) 50%, transparent);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 48px;
        }
        
        .work-item .label {
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.5);
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .work-item h3 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .work-item p {
            color: rgba(255,255,255,0.6);
            line-height: 1.6;
        }
        
        /* Footer */
        footer {
            padding: 48px 0;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }
        
        @media (max-width: 1024px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        @media (max-width: 768px) {
            .hero { height: 60vh; min-height: 400px; }
            .grid, .works { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <section class="hero">
        <div class="hero-bg"></div>
        <div class="hero-content">
            <p class="logo">创想世界</p>
            <h1>创想<br>数字体验</h1>
            <p>专注于网页应用、小程序和互动体验的精心打造，注重细节与用户体验。</p>
        </div>
    </section>
    
    <div class="container">
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">分类</h2>
            </div>
            <div class="grid">
                <div class="grid-item" onclick="location.href='#'">
                    <div class="grid-bg" style="background: linear-gradient(45deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center;">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">
                            <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>
                        </svg>
                    </div>
                    <span class="grid-count">0</span>
                    <div class="grid-overlay">
                        <h3>网页</h3>
                        <p>网站、H5页面、落地页</p>
                    </div>
                </div>
                <div class="grid-item" onclick="location.href='#'">
                    <div class="grid-bg" style="background: linear-gradient(45deg, #2d1b4e, #1a1a2e); display: flex; align-items: center; justify-content: center;">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">
                            <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12" y2="18"/>
                        </svg>
                    </div>
                    <span class="grid-count">0</span>
                    <div class="grid-overlay">
                        <h3>小程序</h3>
                        <p>微信小程序、UniApp</p>
                    </div>
                </div>
                <div class="grid-item" onclick="location.href='games.html'">
                    <div class="grid-bg" style="background: linear-gradient(45deg, #0f3460, #16213e); display: flex; align-items: center; justify-content: center;">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                    <span class="grid-count">1</span>
                    <div class="grid-overlay">
                        <h3>游戏</h3>
                        <p>HTML5游戏、互动体验</p>
                    </div>
                </div>
            </div>
        </section>
        
        <section class="section">
            <div class="section-header">
                <h2 class="section-title">精选</h2>
            </div>
            <div class="works">
                <div class="work-item" onclick="location.href='game.html'">
                    <div class="work-bg" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center;">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                    </div>
                    <div class="work-overlay">
                        <p class="label">游戏</p>
                        <h3>行动代号</h3>
                        <p>双人对战猜词游戏，AI生成词库，多种主题</p>
                    </div>
                </div>
                <div class="work-item">
                    <div class="work-bg" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); display: flex; align-items: center; justify-content: center;">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5">
                            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                    </div>
                    <div class="work-overlay">
                        <p class="label">网页</p>
                        <h3>即将上线</h3>
                        <p>更多项目正在准备中</p>
                    </div>
                </div>
            </div>
        </section>
        
        <footer>
            <p>© 2026 创想世界. 保留所有权利。</p>
        </footer>
    </div>
</body>
</html>
